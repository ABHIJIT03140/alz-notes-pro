<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALZ Notes Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:20px;
}

textarea{
width:100%;
height:220px;
background:#1e1e1e;
color:white;
border:none;
border-radius:20px;
padding:20px;
font-size:18px;
outline:none;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
margin-top:12px;
cursor:pointer;
}

.saveBtn{
background:#00ff88;
color:black;
}

.pdfBtn{
background:#ff4444;
color:white;
}

.uploadBtn{
background:#4488ff;
color:white;
}

.noteCard{
background:#1e1e1e;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.noteTitle{
font-size:22px;
margin-bottom:10px;
}

.deleteBtn{
background:red;
color:white;
margin-top:15px;
}

.sectionTitle{
margin-top:30px;
font-size:28px;
}

.fileInput{
width:100%;
padding:15px;
background:#1e1e1e;
border-radius:15px;
margin-top:15px;
margin-bottom:10px;
color:white;
}

</style>
</head>

<body>

<div class="container">

<h1 class="title">ALZ Notes Pro</h1>

<textarea id="note" placeholder="Write your notes here..."></textarea>

<button class="saveBtn" onclick="saveNote()">
Save Note
</button>

<button class="pdfBtn" onclick="downloadPDF()">
Download Notes PDF
</button>

<h2 class="sectionTitle">Upload PDF</h2>

<input type="file" id="pdfUpload" class="fileInput" accept=".pdf">

<button class="uploadBtn" onclick="uploadPDF()">
Upload PDF
</button>

<h2 class="sectionTitle">Saved Notes</h2>

<div id="notesList"></div>

<h2 class="sectionTitle">Uploaded PDFs</h2>

<div id="pdfList"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];

let pdfs = JSON.parse(localStorage.getItem("pdfs")) || [];

function saveNote(){

let text = document.getElementById("note").value;

if(text.trim()=="") return;

notes.push(text);

localStorage.setItem("notes",JSON.stringify(notes));

document.getElementById("note").value="";

showNotes();
}

function showNotes(){

let list = document.getElementById("notesList");

list.innerHTML="";

notes.forEach((n,index)=>{

list.innerHTML += `

<div class="noteCard">

<h3 class="noteTitle">
Note ${index+1}
</h3>

<p>${n}</p>

<button class="deleteBtn"
onclick="deleteNote(${index})">

Delete Note

</button>

</div>

`;

});
}

function deleteNote(index){

notes.splice(index,1);

localStorage.setItem("notes",JSON.stringify(notes));

showNotes();
}

async function downloadPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

let allNotes = "";

notes.forEach((n,index)=>{

allNotes += "Note "+(index+1)+":\n"+n+"\n\n";

});

doc.text(allNotes,10,10);

doc.save("ALZ_Notes.pdf");
}

function uploadPDF(){

let file = document.getElementById("pdfUpload").files[0];

if(!file){

alert("Select PDF First");

return;
}

pdfs.push(file.name);

localStorage.setItem("pdfs",JSON.stringify(pdfs));

showPDFs();
}

function showPDFs(){

let list = document.getElementById("pdfList");

list.innerHTML="";

pdfs.forEach((pdf,index)=>{

list.innerHTML += `

<div class="noteCard">

<h3 class="noteTitle">
PDF ${index+1}
</h3>

<p>${pdf}</p>

</div>

`;

});
}

window.onload = function(){

showNotes();

showPDFs();
}

</script>

</body>
</html>
